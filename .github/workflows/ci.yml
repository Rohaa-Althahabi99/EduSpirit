name: EduSpirit CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore API
        run: dotnet restore backend/src/EduSpirit.API/EduSpirit.API.csproj

      - name: Build API
        run: dotnet build backend/src/EduSpirit.API/EduSpirit.API.csproj --no-restore --configuration Release

      - name: Restore Tests
        run: dotnet restore backend/tests/EduSpirit.Tests/EduSpirit.Tests.csproj

      - name: Run Unit Tests
        run: dotnet test backend/tests/EduSpirit.Tests/EduSpirit.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/tests/EduSpirit.Tests/TestResults/

  flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze #--fatal-infos

      - name: Run tests
        run: flutter test

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build image (verification only — لا يُرفع لأي Registry هنا)
        run: docker build -t eduspirit-api:${{ github.sha }} ./backend
